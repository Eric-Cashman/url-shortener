<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snip — URL Shortener</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #e2e8f0;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      padding: 2.5rem;
      border-radius: 16px;
      width: min(92vw, 520px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.9rem; }
    p.sub { margin: 0 0 1.5rem; color: #94a3b8; }
    form { display: flex; gap: 0.5rem; }
    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #e2e8f0;
      font-size: 1rem;
    }
    button {
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #0b1220;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 10px;
      background: #0b1220;
      border: 1px solid #334155;
      display: none;
      word-break: break-all;
    }
    .result a { color: #38bdf8; font-weight: 600; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔗 Snip</h1>
    <p class="sub">Paste a long URL and get a short one.</p>
    <form id="form">
      <input id="url" type="text" placeholder="https://example.com/very/long/link" required />
      <button type="submit">Shorten</button>
    </form>
    <div class="result" id="result"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('url');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.style.display = 'none';
      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input.value }),
        });
        const data = await res.json();
        result.style.display = 'block';
        if (res.ok) {
          result.innerHTML =
            `Short URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
        } else {
          result.innerHTML = `<span class="error">${data.error}</span>`;
        }
      } catch (err) {
        result.style.display = 'block';
        result.innerHTML = '<span class="error">Request failed.</span>';
      }
    });
  </script>
</body>
</html>
