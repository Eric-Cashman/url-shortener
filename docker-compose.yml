# Docker Compose makes it easy to run the app with a single command:
#   docker compose up --build
#
# It wires up the port mapping and a persistent volume for the database
# so your shortened URLs survive container restarts.

services:
  app:
    build: .
    image: url-shortener:latest
    ports:
      # host:container — visit http://localhost:3000 on your machine.
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/urls.db
    volumes:
      # Persist the SQLite database outside the container.
      - url-data:/app/data
    restart: unless-stopped
    healthcheck:
      # Docker periodically hits /health to know if the app is alive.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  url-data:
